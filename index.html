<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenAI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Highlight.js Theme (Tokyo Night Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',
                1000: '#06090f', // Deeper black
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #374151; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563; 
      }
      body {
        background-color: #0d1117;
        color: #e2e8f0;
      }
      
      /* Markdown Styles */
      .markdown-body {
        font-size: 0.95rem;
        line-height: 1.7;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        font-weight: 700;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: #f8fafc;
      }
      .markdown-body h1 { font-size: 1.5em; }
      .markdown-body h2 { font-size: 1.25em; border-bottom: 1px solid #374151; padding-bottom: 0.3em; }
      .markdown-body p { margin-bottom: 1em; }
      .markdown-body ul, .markdown-body ol { margin-bottom: 1em; padding-left: 1.5em; }
      .markdown-body ul { list-style-type: disc; }
      .markdown-body ol { list-style-type: decimal; }
      .markdown-body code {
        background-color: rgba(110, 118, 129, 0.4);
        padding: 0.2em 0.4em;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85em;
      }
      .markdown-body pre code {
        background-color: transparent;
        padding: 0;
        font-size: 100%;
        /* removed color: inherit; to fix syntax highlighting */
      }
      /* Removed border and background from pre since it's now handled by the .code-wrapper component in React */
      .markdown-body pre {
        padding: 1rem;
        overflow: auto;
        background-color: transparent; 
        border-radius: 0;
        border: none;
        margin-bottom: 0; /* Margin is handled by wrapper */
        -webkit-overflow-scrolling: touch; /* Enable smooth scrolling on iOS */
      }
      .markdown-body a {
        color: #58a6ff;
        text-decoration: none;
      }
      .markdown-body a:hover {
        text-decoration: underline;
      }
      .markdown-body blockquote {
        border-left: 4px solid #30363d;
        color: #8b949e;
        padding-left: 1em;
        margin-left: 0;
      }

      /* --- Custom Syntax Highlighting Overrides for cleaner Bash/Shell --- */
      /* Make Bash/Shell look cleaner and more vivid */
      .hljs-comment {
         color: #565f89 !important;
         font-style: italic;
      }
      
      /* Specific Bash/Shell Tweaks */
      .language-bash .hljs-built_in, 
      .language-sh .hljs-built_in,
      .language-shell .hljs-built_in,
      .language-zsh .hljs-built_in { 
          color: #7aa2f7 !important; /* Brighter Blue for commands */
          font-weight: 500;
      }
      
      .language-bash .hljs-string, 
      .language-sh .hljs-string,
      .language-shell .hljs-string,
      .language-zsh .hljs-string { 
          color: #9ece6a !important; /* Brighter Green for strings */
      }

      .language-bash .hljs-variable, 
      .language-sh .hljs-variable,
      .language-shell .hljs-variable,
      .language-zsh .hljs-variable { 
          color: #bb9af7 !important; /* Purple for variables */
      }

      .language-bash .hljs-literal, 
      .language-sh .hljs-literal,
      .language-shell .hljs-literal { 
          color: #ff9e64 !important; /* Orange for flags/literals */
      }

      /* Fixes for plain text / output blocks to match terminal look */
      .language-plaintext {
          color: #c0caf5;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "marked": "https://esm.sh/marked@12.0.0",
    "highlight.js": "https://esm.sh/highlight.js@11.9.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
